# Deploy der Web-App (apps/web) als statischer Export auf GitHub Pages.
# Derselbe isolierte Build und Smoke laufen lokal und in CI. App-Quellen sowie
# der normale lokale Next-Produktionsbuild bleiben dabei unverändert.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit-Tests (Engine und Anwendung)
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Isolierter statischer Export für /pv-belegung
        run: npm run build:pages
      - name: Headless-Browser für Release-Prüfung
        run: npx playwright install --with-deps chromium
      - name: Export-Artefakt prüfen (Desktop und Smartphone)
        run: npm run test:pages
      - name: Release-Evidenz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-pruefung
          path: |
            .release/pages/manifest.json
            .release/pages-smoke-results.json
            .release/test-results
            .release/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .release/pages/apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
